<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track Racer</title>
  <style>
    /* Base reset — applied immediately before any JS runs */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0d0d0f;
      overflow: hidden;
      height: 100vh;
    }
    /* Hide every phase div by default; scenes show them as needed */
    #draw-phase, #lobby-phase { display: none; }
    #game-phase { position: fixed; inset: 0; display: block; }
    #game-phase canvas { display: block; }
  </style>
</head>
<body>

  <!-- ══ DRAW PHASE (managed by DrawingPhase.js) ═══════════════════════════ -->
  <div id="draw-phase">
    <div id="draw-header">
      <h1>🏁 Custom Track Racer</h1>
      <span class="subtitle">Draw a loop → Generate → Race</span>
    </div>
    <div id="canvas-wrap">
      <canvas id="drawCanvas"></canvas>
    </div>
    <div id="draw-footer">
      <button class="btn" id="btn-generate">⚙ Generate Track</button>
      <button class="btn" id="btn-clear">✕ Clear</button>
      <button class="btn" id="btn-race">▶ Race!</button>
      <span id="status">Click &amp; drag to draw a closed loop, then Generate Track</span>
    </div>
  </div>

  <!-- ══ GAME PHASE (Phaser canvas mount) ══════════════════════════════════ -->
  <div id="game-phase"></div>

  <!-- Lobby DOM is built at runtime by Lobby.js -->

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
