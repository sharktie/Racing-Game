<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Track Racer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=block">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    html, body { height: 100%; overflow: hidden; background: #000; }
    body, button, input {
      font: 16px/1.5 'Press Start 2P', monospace;
      color: #fff1e8;
      text-transform: uppercase;
    }
    @media (min-height: 800px) {
      body, button, input { font-size: 24px; }
    }

    #game { position: fixed; inset: 0; }
    canvas { display: block; image-rendering: pixelated; }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5em;
      padding: 1em;
      background: #000;
      text-align: center;
    }
    #watch { z-index: 1; }

    h1 { color: #ffec27; font-size: 2em; }
    form, #room { display: flex; flex-direction: column; align-items: center; gap: 1em; }
    ol { list-style: none; line-height: 2; }

    input {
      width: calc(16ch + 1.5em);
      padding: 0.5em 0.75em;
      border: 4px solid #fff1e8;
      background: #000;
      color: #ffec27;
      caret-color: #ffec27;
      outline: none;
    }
    input:focus { border-color: #ffec27; }

    button {
      position: relative;
      padding: 0.25em 0;
      border: 0;
      background: none;
      cursor: pointer;
    }
    button:hover, button:focus { color: #ffec27; outline: none; }
    button:hover::before, button:focus::before {
      content: '>';
      position: absolute;
      right: 100%;
      margin-right: 1ch;
    }
    button:disabled { color: #5f574f; cursor: default; }
    button:disabled::before { content: none; }

    .wrap {
      flex: 1;
      min-height: 0;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #draw-canvas { cursor: crosshair; touch-action: none; }
    .row { display: flex; gap: 4em; }

    .dim { color: #c2c3c7; }
    .bad { color: #ff004d; }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { visibility: hidden; } }
  </style>
</head>
<body>
  <div id="game"></div>

  <div id="lobby" class="screen" hidden>
    <form id="join">
      <label for="name">ENTER NAME</label>
      <input id="name" maxlength="16" autocomplete="off" spellcheck="false">
      <button id="join-button">JOIN</button>
    </form>
    <div id="room" hidden>
      <h1 id="count"></h1>
      <ol id="players"></ol>
      <button id="draw-track" type="button">DRAW TRACK</button>
      <p id="wait" class="dim blink">WAITING FOR HOST</p>
    </div>
    <p id="error" class="bad"></p>
    <button id="lobby-back" type="button">BACK</button>
  </div>

  <div id="draw" class="screen" hidden>
    <p id="status"></p>
    <div class="wrap"><canvas id="draw-canvas" width="512" height="320"></canvas></div>
    <div class="row">
      <button id="draw-back" type="button">BACK</button>
      <button id="race" type="button">RACE</button>
    </div>
  </div>

  <div id="watch" class="screen" hidden>
    <p class="blink">HOST IS DRAWING</p>
    <div class="wrap"><canvas id="watch-canvas" width="512" height="320"></canvas></div>
    <button id="watch-leave" type="button">LEAVE</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
